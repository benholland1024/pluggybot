[project]
name = "pluggybot"
version = "0.1.0"
description = "A simulated robot that plugs itself in using RL and other tools"
readme = "README.md"
authors = [
    { name = "Ben Holland", email = "benholland1024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "moms-apriltag>=2023.1.15",
    "mujoco>=3.10.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pupil-apriltags>=1.0.4.post11",
    "scipy>=1.18.0",
    "stable-baselines3>=2.9.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.114",
]

# PyPI's default torch is built for CUDA 13.0, which needs a 580+ NVIDIA driver.
# This machine runs 570.x (CUDA 12.8), so the default wheel silently falls back
# to CPU. Pull torch/torchvision from PyTorch's cu128 index instead.
# `explicit = true` means ONLY these two packages come from it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    # Whole-mission runs (~90 s sim each). They stay in the default suite —
    # the two lessons that cost the most here (a frame-relative verdict, a
    # sign on the return travel) were only visible end to end.
    "slow: full-mission integration runs",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
